# ---- SondeAlert docker-compose configuration ----
services:
  sondealert:
    build: .
    container_name: sondealert
    restart: always

    # Gebruik host-netwerk zodat UDP 5050 en HTTP 8080 direct werken
    network_mode: host

    # Nodig voor GPIO- en I²C-toegang op de Raspberry Pi
    privileged: true
    devices:
      - /dev/i2c-1:/dev/i2c-1

    # Deel de data-map (voor sondes.json en instellingen)
    volumes:
      - ./data:/app/data

    # Omgevingsvariabelen (pas gerust aan)
    environment:
      - BIND_HOST=0.0.0.0
      - BIND_PORT=8080
      - GPS_PORT=5050
      - MONTHS_BACK=24
      - ALT_MAX_M=600
      - UPDATE_HOURS=24
      - BUZZER_ENABLED=true
      - NEAR_THRESHOLD_M=15000
