<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SondeAlert · Instellingen</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header class="sa-header">
<div class="container">
<div class="brand">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2v20M2 12h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
<span>Instellingen</span>
</div>
<nav class="nav">
<a class="btn btn-ghost" href="/">Dashboard</a>
</nav>
</div>
</header>


<main class="container">
<form id="settingsForm" class="card form">
<div class="card-header">
<h2>Algemeen</h2>
<div id="saveStatus" class="meta">—</div>
</div>


<div class="grid-2">
<label class="field">
<span>Max. afstand (meter)</span>
<input type="number" name="NEAR_THRESHOLD_M" min="1000" step="100" placeholder="15000" required />
</label>


<label class="field">
<span>Max. hoogte (meter)</span>
<input type="number" name="ALT_MAX_M" min="0" step="10" placeholder="600" required />
</label>


<label class="field">
<span>Terugkijkperiode (maanden)</span>
<input type="number" name="MONTHS_BACK" min="1" max="36" placeholder="24" required />
</label>


<label class="field switch">
<input type="checkbox" name="BUZZER_ENABLED" />
<span>Buzzer aan bij nadering</span>
</label>
</div>


<h3>Filters</h3>
<div class="grid-2">
<label class="field">
<span>Statussen (CSV)</span>
<input type="text" name="STATUS_KEEP" placeholder="UNKNOWN,NEED ATTENTION" />
<small>Voorbeeld: <code>UNKNOWN,NEED ATTENTION</code></small>
</label>
<label class="field">
<span>Launch filters (één per regel)</span>
<textarea name="LAUNCH_FILTERS" rows="4" placeholder="DE BILT (NL)
DE BILT"></textarea>
</label>
</div>


<h3>Netwerk</h3>
<div class="grid-2">
<label class="field">
<span>Webserver host</span>
</html>
