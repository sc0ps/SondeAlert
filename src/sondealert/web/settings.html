<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SondeAlert Settings</title>
<style>
  body{margin:0;background:#121212;color:#e0e0e0;font-family:system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
  header{background:#0a0a0a;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.6)}
  header a{color:#1e90ff;text-decoration:none}
  main{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:16px}
  form{background:#1e1e1e;padding:20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.5);max-width:520px;width:100%}
  label{display:block;margin-top:12px;font-weight:600;color:#ccc}
  input,select,textarea{width:100%;padding:10px;margin-top:6px;border-radius:8px;border:1px solid #444;background:#2b2b2b;color:#eee}
  .row{display:flex;gap:10px}
  .row > div{flex:1}
  button{margin-top:16px;padding:12px 16px;background:#1e90ff;color:#fff;border:none;border-radius:8px;cursor:pointer}
  .btns{display:flex;gap:10px;align-items:center}
  .meta{margin-top:10px;color:#aaa}
  footer{text-align:center;padding:10px;background:#0a0a0a;color:#888;font-size:.85rem}
</style>
</head>
<body>
  <header>
    <div><strong>Settings</strong></div>
    <nav><a href="index.html">← Back</a></nav>
  </header>
  <main>
    <form id="f">
      <div class="row">
        <div>
          <label for="near">Maximum distance (meters)</label>
          <input type="number" id="near" min="1000" step="500"/>
        </div>
        <div>
          <label for="alt">Maximum altitude (m)</label>
          <input type="number" id="alt" min="50" step="10"/>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="hours">Update interval (hours)</label>
          <input type="number" id="hours" min="1" step="1"/>
        </div>
        <div>
          <label for="buzzer">Buzzer enabled</label>
          <select id="buzzer"><option value="true">Yes</option><option value="false">No</option></select>
        </div>
      </div>

      <label for="status">Statuses (comma)</label>
      <input id="status" placeholder="UNKNOWN, NEED ATTENTION"/>

      <label for="launch">Launch filters (one per line)</label>
      <textarea id="launch" rows="4" placeholder="DE BILT (NL)&#10;DE BILT"></textarea>

      <div class="btns">
        <button type="submit">Save</button>
        <button type="button" id="update">Update now</button>
      </div>
      <div class="meta" id="meta">Last update: unknown — items: 0</div>
    </form>
  </main>
  <footer>© 2025 SondeAlert — Scops Owl Designs</footer>

<script>
async function load(){
  const s = await (await fetch('/settings.json')).json();
  near.value = s.NEAR_THRESHOLD_M;
  alt.value = s.ALT_MAX_M;
  hours.value = s.UPDATE_HOURS;
  buzzer.value = s.BUZZER_ENABLED ? 'true' : 'false';
  status.value = (s.STATUS_KEEP || []).join(', ');
  launch.value = (s.LAUNCH_FILTERS || []).join('\n');
  const lu = s.last_update ? new Date(s.last_update*1000).toLocaleString() : 'never';
  document.getElementById('meta').textContent = `Last update: ${lu} — items: ${s.sondes_count ?? 0}`;
}

document.getElementById('f').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const payload = {
    NEAR_THRESHOLD_M: parseInt(near.value,10),
    ALT_MAX_M: parseInt(alt.value,10),
    UPDATE_HOURS: parseInt(hours.value,10),
    BUZZER_ENABLED: buzzer.value === 'true',
    STATUS_KEEP: status.value.split(',').map(x=>x.trim()).filter(Boolean),
    LAUNCH_FILTERS: launch.value.split('\n').map(x=>x.trim()).filter(Boolean)
  };
  await fetch('/save_settings', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
  alert('Settings saved');
  load();
});

document.getElementById('update').addEventListener('click', async ()=>{
  await fetch('/update_now', {method:'POST'});
  alert('Update started in background. Refresh in a moment.');
});

load();
</script>
</body>
</html>
