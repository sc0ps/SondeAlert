<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SondeAlert Settings</title>
  <style>
    body {
      margin: 0;
      background: #121212;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #0a0a0a;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    form {
      background: #1e1e1e;
      padding: 25px 35px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      max-width: 480px;
      width: 100%;
    }

    label { display: block; margin-top: 15px; font-weight: 600; color: #ccc; }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #2b2b2b;
      color: #eee;
    }

    button {
      margin-top: 25px;
      padding: 12px 20px;
      background: #1e90ff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      transition: background 0.3s;
    }

    button:hover { background: #0077e6; }

    footer {
      text-align: center;
      padding: 10px;
      background: #0a0a0a;
      color: #888;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Settings</h1>
    <button onclick="window.location.href='index.html'">← Back</button>
  </header>

  <main>
    <form id="settings-form">
      <label for="nearThreshold">Maximum distance (m):</label>
      <input type="number" id="nearThreshold" min="1000" step="500">

      <label for="altMax">Maximum altitude (m):</label>
      <input type="number" id="altMax" min="100" step="100">

      <label for="updateHours">Update interval (h):</label>
      <input type="number" id="updateHours" min="1" step="1">

      <label for="buzzer">Enable buzzer:</label>
      <select id="buzzer">
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>

      <button type="submit">Save Settings</button>
    </form>
  </main>

  <footer>© 2025 SondeAlert – Scops Owl Designs</footer>

  <script>
    async function loadSettings() {
      const res = await fetch('/settings.json');
      const s = await res.json();
      nearThreshold.value = s.NEAR_THRESHOLD_M || 15000;
      altMax.value = s.ALT_MAX_M || 600;
      updateHours.value = s.UPDATE_HOURS || 24;
      buzzer.value = s.BUZZER_ENABLED ? 'true' : 'false';
    }

    document.getElementById('settings-form').onsubmit = async e => {
      e.preventDefault();
      const data = {
        NEAR_THRESHOLD_M: parseInt(nearThreshold.value),
        ALT_MAX_M: parseInt(altMax.value),
        UPDATE_HOURS: parseInt(updateHours.value),
        BUZZER_ENABLED: buzzer.value === 'true',
      };
      await fetch('/save_settings', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify(data)
      });
      alert('Settings saved successfully.');
    };

    loadSettings();
  </script>
</body>
</html>
