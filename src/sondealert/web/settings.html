<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>⚙️ SondeAlert Instellingen</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
    h2 { color: #1565c0; }
    label { display: block; margin-top: 10px; font-weight: 600; }
    input { width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc; }
    button {
      margin-top: 20px; background: #1565c0; color: white; border: none;
      padding: 10px 14px; border-radius: 6px; cursor: pointer;
    }
    button:hover { background: #0d47a1; }
    .back { display: inline-block; margin-bottom: 20px; color: #1565c0; text-decoration: none; }
  </style>
</head>
<body>
  <a href="/" class="back">⬅ Terug naar kaart</a>
  <h2>⚙️ Instellingen</h2>
  <form id="settingsForm">
    <label>Maximale hoogte (ALT_MAX_M)</label>
    <input type="number" id="ALT_MAX_M" name="ALT_MAX_M" />

    <label>Maximale afstand (NEAR_THRESHOLD_M)</label>
    <input type="number" id="NEAR_THRESHOLD_M" name="NEAR_THRESHOLD_M" />

    <label>Update-interval (UPDATE_HOURS)</label>
    <input type="number" id="UPDATE_HOURS" name="UPDATE_HOURS" />

    <label>Buzzer aan/uit</label>
    <select id="BUZZER_ENABLED" name="BUZZER_ENABLED">
      <option value="true">Aan</option>
      <option value="false">Uit</option>
    </select>

    <button type="submit">💾 Opslaan</button>
  </form>

  <script>
    async function loadSettings() {
      const s = await fetch("/settings.json").then(r => r.json());
      for (const k in s) {
        const el = document.getElementById(k);
        if (el) el.value = s[k];
      }
    }

    document.getElementById("settingsForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target).entries());
      data.BUZZER_ENABLED = data.BUZZER_ENABLED === "true";
      await fetch("/save_settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      alert("Instellingen opgeslagen!");
    });

    loadSettings();
  </script>
</body>
</html>
