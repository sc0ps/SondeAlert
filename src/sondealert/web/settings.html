<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SondeAlert — Settings</title>
<style>
:root {
  --bg1:#0a2540;
  --bg2:#001220;
  --accent:#2ea8ff;
  --accent-hover:#48b6ff;
  --card:rgba(255,255,255,0.08);
  --text:#ffffff;
  --muted:#aab;
}
body {
  margin:0;
  font-family:"Segoe UI",Roboto,Arial,sans-serif;
  background:linear-gradient(180deg,var(--bg1),var(--bg2));
  color:var(--text);
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
header {
  text-align:center;
  padding:30px 0 10px;
}
h1 {
  margin:0;
  color:var(--accent);
  font-size:2rem;
}
.tabs {
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:10px;
}
.tab-btn {
  border:none;
  background:transparent;
  color:var(--accent);
  border:1px solid var(--accent);
  padding:8px 16px;
  border-radius:999px;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}
.tab-btn.active {
  background:var(--accent);
  color:#001220;
}
.tab-btn:hover {
  background:var(--accent-hover);
  color:#001220;
}
.container {
  flex:1;
  width:90%;
  max-width:700px;
  margin:0 auto;
  padding-bottom:20px;
}
.card {
  background:var(--card);
  border-radius:14px;
  box-shadow:0 0 15px rgba(0,0,0,0.3);
  padding:24px 26px; /* extra padding rechts */
  margin-top:16px;
}
label {
  display:block;
  margin-top:14px;
  font-weight:600;
  color:var(--accent);
}
input, textarea {
  width:100%;
  background:rgba(255,255,255,0.1);
  border:none;
  border-radius:8px;
  color:#fff;
  padding:10px;
  margin-top:4px;
  margin-bottom:6px;
  font-size:1em;
}
input[type="checkbox"] {
  width:auto;
  transform:scale(1.3);
  margin-right:6px;
}
button {
  border:none;
  border-radius:8px;
  padding:10px 16px;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}
button.save {
  background:var(--accent);
  color:#001220;
}
button.save:hover {
  background:var(--accent-hover);
}
button.back {
  background:transparent;
  border:1px solid var(--accent);
  color:var(--accent);
  margin-left:8px;
}
button.back:hover {
  background:var(--accent-hover);
  color:#001220;
}
#msg {
  display:none;
  text-align:center;
  background:rgba(0,255,100,0.2);
  color:#00e676;
  padding:10px;
  border-radius:10px;
  margin-top:10px;
  font-weight:600;
}
footer {
  text-align:center;
  padding:14px 0;
  color:var(--muted);
  font-size:0.9em;
  border-top:1px solid rgba(255,255,255,0.1);
}
</style>
</head>
<body>
<header>
  <h1>SondeAlert</h1>
  <div class="tabs">
    <button class="tab-btn" onclick="window.location.href='/'">Dashboard</button>
    <button class="tab-btn active" onclick="window.location.href='/settings'">Settings</button>
  </div>
</header>

<div class="container">
  <div class="card">
    <h3>System Settings</h3>
    <form id="settingsForm">
      <label><input type="checkbox" name="BUZZER_ENABLED" id="buzz"> Enable buzzer alert</label>

      <label for="thr">NEAR_THRESHOLD_M (m):</label>
      <input id="thr" name="NEAR_THRESHOLD_M">

      <label for="months">MONTHS_BACK:</label>
      <input id="months" name="MONTHS_BACK">

      <label for="alt">ALT_MAX_M:</label>
      <input id="alt" name="ALT_MAX_M">

      <label for="status">STATUS_KEEP (comma separated):</label>
      <input id="status" name="STATUS_KEEP">

      <label for="launch">LAUNCH_FILTERS (one per line):</label>
      <textarea id="launch" name="LAUNCH_FILTERS" rows="4"></textarea>

      <div style="margin-top:16px;text-align:center;">
        <button type="submit" class="save">Save Settings</button>
        <button type="button" class="back" onclick="window.location.href='/'">Back</button>
      </div>
    </form>
    <div id="msg">Settings saved ✓</div>
  </div>
</div>

<footer>
  <p>© 2025 SondeAlert — Developed by Scops Owl Designs</p>
</footer>

<script>
// === load settings on page open ===
async function loadSettings() {
  try {
    const r = await fetch("/api/settings");
    const s = await r.json();
    document.getElementById("thr").value = s.NEAR_THRESHOLD_M;
    document.getElementById("months").value = s.MONTHS_BACK;
    document.getElementById("alt").value = s.ALT_MAX_M;
    document.getElementById("status").value = s.STATUS_KEEP.join(",");
    document.getElementById("launch").value = s.LAUNCH_FILTERS.join("\n");
    document.getElementById("buzz").checked = !!s.BUZZER_ENABLED;
  } catch (e) {
    console.error("Settings load failed", e);
  }
}
loadSettings();

// === save settings ===
document.getElementById("settingsForm").addEventListener("submit", async e => {
  e.preventDefault();
  const form = e.target;
  const data = new FormData(form);
  const resp = await fetch("/settings", { method: "POST", body: data });
  const j = await resp.json();

  const msg = document.getElementById("msg");
  msg.textContent = j.ok ? "✅ Settings saved successfully" : "⚠️ Failed to save settings";
  msg.style.display = "block";
  msg.style.background = j.ok ? "rgba(0,255,100,0.2)" : "rgba(255,100,0,0.2)";
  msg.style.color = j.ok ? "#00e676" : "#ff7043";
  setTimeout(() => { msg.style.display = "none"; }, 2500);
});
</script>
</body>
</html>
