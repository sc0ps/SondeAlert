<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <title>SondeAlert Instellingen</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f7f7f7; }
    label { display: block; margin-top: 10px; }
    input { margin-left: 10px; }
    button { margin-top: 15px; padding: 8px 14px; font-size: 14px; }
    #status { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>SondeAlert Instellingen</h1>
  <form id="settingsForm">
    <label>
      Maximale afstand (NEAR_THRESHOLD_M):
      <input type="number" id="NEAR_THRESHOLD_M" name="NEAR_THRESHOLD_M">
    </label>
    <label>
      Hoogtelimiet (ALT_MAX_M):
      <input type="number" id="ALT_MAX_M" name="ALT_MAX_M">
    </label>
    <label>
      Buzzer aan:
      <input type="checkbox" id="BUZZER_ENABLED" name="BUZZER_ENABLED">
    </label>
    <button type="submit">Opslaan</button>
  </form>

  <p id="status"></p>

  <script>
    async function loadSettings() {
      const resp = await fetch('/settings.json');
      const settings = await resp.json();
      document.getElementById('NEAR_THRESHOLD_M').value = settings.NEAR_THRESHOLD_M;
      document.getElementById('ALT_MAX_M').value = settings.ALT_MAX_M;
      document.getElementById('BUZZER_ENABLED').checked = settings.BUZZER_ENABLED;
    }

    document.getElementById('settingsForm').addEventListener('submit', async e => {
      e.preventDefault();
      const newSettings = {
        ...await (await fetch('/settings.json')).json(),
        NEAR_THRESHOLD_M: parseInt(document.getElementById('NEAR_THRESHOLD_M').value),
        ALT_MAX_M: parseInt(document.getElementById('ALT_MAX_M').value),
        BUZZER_ENABLED: document.getElementById('BUZZER_ENABLED').checked
      };
      const resp = await fetch('/settings.json', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(newSettings)
      });
      document.getElementById('status').textContent = resp.ok ? '✅ Instellingen opgeslagen!' : '❌ Fout bij opslaan.';
    });

    loadSettings();
  </script>
</body>
</html>
