<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SondeAlert Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
  :root{--bg:#121212;--panel:#1e1e1e;--accent:#1e90ff;--text:#e0e0e0;}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;}
  header{background:#0a0a0a;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.6)}
  header a{color:var(--accent);text-decoration:none}
  #map{flex:1;width:100%}
  #info-panel{background:var(--panel);border-top:2px solid var(--accent);padding:12px;display:flex;gap:8px;flex-wrap:wrap}
  .card{flex:1;min-width:260px;background:#262626;border:1px solid #333;border-radius:10px;padding:10px}
  .card h3{margin:0 0 6px;color:var(--accent)}
  footer{text-align:center;background:#0a0a0a;color:#888;font-size:.85rem;padding:8px}
  .status-ok{color:#6be075;font-weight:bold}
  .status-warn{color:#ffad33;font-weight:bold}
  .leaflet-control-layers{background:rgba(30,30,30,.9);color:#fff;border-radius:6px}
</style>
</head>
<body>
  <header>
    <div><strong>SondeAlert</strong></div>
    <nav><a href="settings.html">Settings</a></nav>
  </header>

  <div id="map"></div>

  <div id="info-panel">
    <div class="card">
      <h3>GPS</h3>
      <div id="gps-status">Status: unknown</div>
      <div id="gps-coords">Lat: ---, Lon: ---</div>
      <div id="last-update">Sonde list: unknown</div>
    </div>
    <div class="card">
      <h3>Nearest sonde</h3>
      <div id="n-name">Name: ---</div>
      <div id="n-dist">Distance: ---</div>
      <div id="n-alt">Altitude: ---</div>
      <div id="n-status">Status: ---</div>
      <div id="n-ring">Ring level: ---</div>
    </div>
  </div>

  <footer>© 2025 SondeAlert — Scops Owl Designs</footer>

<script>
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap'});
const dark = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; CartoDB'});
const sat  = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri'});

const map = L.map('map', {center:[52.1,4.3], zoom:8, layers:[osm]});
L.control.layers({"OpenStreetMap":osm,"Dark":dark,"Satellite":sat}, null, {position:'topright'}).addTo(map);

const myIcon = L.icon({
  iconUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
  shadowUrl:'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
  iconSize:[25,41], iconAnchor:[12,41], popupAnchor:[0,-35]
});

function dot(color){
  return L.divIcon({html:`<div style="width:14px;height:14px;background:${color};border:2px solid #fff;border-radius:50%"></div>`,className:'',iconSize:[14,14]});
}
const ORANGE = dot('orange');  // UNKNOWN
const BLUE   = dot('#1e90ff'); // NEED ATTENTION

let gpsMarker=null, nearestLine=null;
let rings=[]; let sondeMarkers=[];

function fmtDist(m){
  if(!m || isNaN(m)) return '—';
  return m<1000? `${m.toFixed(0)} m` : `${(m/1000).toFixed(2)} km`;
}

async function fetchJSON(url){ const r = await fetch(url); return r.json(); }

function drawRings(lat, lon, maxM){
  rings.forEach(r => map.removeLayer(r)); rings=[];
  const step = 2000; // 2km
  for(let d=step; d<=maxM; d+=step){
    const c = L.circle([lat,lon], {radius:d, color:'#888', weight:1, fill:false, opacity:0.4});
    c.addTo(map); rings.push(c);
  }
}

function updateInfo(settings, meta, gps, nearest){
  document.getElementById('last-update').textContent =
    meta.last_update ? `Sonde list: ${new Date(meta.last_update*1000).toLocaleString()}` : 'Sonde list: never';
  if(gps.fix){
    document.getElementById('gps-status').innerHTML = '<span class="status-ok">✅ Fix OK</span>';
    document.getElementById('gps-coords').textContent = `Lat: ${gps.lat.toFixed(5)}, Lon: ${gps.lon.toFixed(5)}`;
  }else{
    document.getElementById('gps-status').innerHTML = '<span class="status-warn">⚠️ No signal</span>';
    document.getElementById('gps-coords').textContent = 'Lat: ---, Lon: ---';
  }
  if(nearest.item){
    const n = nearest.item;
    document.getElementById('n-name').textContent = `Name: ${n.place || n.id}`;
    document.getElementById('n-dist').textContent = `Distance: ${fmtDist(nearest.distance_m)}`;
    document.getElementById('n-alt').textContent = `Altitude: ${n.alt ?? '—'} m`;
    document.getElementById('n-status').textContent = `Status: ${n.status || '—'}`;
    document.getElementById('n-ring').textContent = `Ring level: ${nearest.ring_level}`;
  }else{
    ['n-name','n-dist','n-alt','n-status','n-ring'].forEach(id=>document.getElementById(id).textContent='—');
  }
}

async function refresh(){
  try{
    const [settings, metaWrap, gps, nearest, all] = await Promise.all([
      fetchJSON('/settings.json'),  // bevat settings + meta (via server)
      fetchJSON('/sondes.json'),   // volledige lijst (met last_update ook)
      fetchJSON('/gps.json'),
      fetchJSON('/nearest.json'),
      fetchJSON('/sondes.json')
    ]);
    const meta = { last_update: settings.last_update ?? metaWrap.last_update };
    updateInfo(settings, meta, gps, nearest);

    // teken mijn marker + ringen
    if(gps.fix){
      if(!gpsMarker) gpsMarker = L.marker([gps.lat, gps.lon], {icon: myIcon}).addTo(map).bindPopup('You');
      gpsMarker.setLatLng([gps.lat, gps.lon]);
      drawRings(gps.lat, gps.lon, settings.NEAR_THRESHOLD_M);
    }

    // sondes tekenen
    sondeMarkers.forEach(m => map.removeLayer(m)); sondeMarkers=[];
    (all.items || []).forEach(s=>{
      const icon = (s.status === 'NEED ATTENTION') ? BLUE : ORANGE;
      const mk = L.marker([s.lat, s.lon], {icon}).addTo(map);
      mk.bindPopup(`<strong>${s.place || s.id}</strong><br>Alt: ${s.alt} m<br>Status: ${s.status}<br>Last: ${s.last}`);
      sondeMarkers.push(mk);
    });

    // lijn naar dichtstbijzijnde
    if(nearestLine){ map.removeLayer(nearestLine); nearestLine=null; }
    if(nearest.item && gps.fix){
      nearestLine = L.polyline([[gps.lat,gps.lon],[nearest.item.lat, nearest.item.lon]], {color:'#ff4444', weight:3}).addTo(map);
    }

  }catch(e){ console.error(e); }
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
