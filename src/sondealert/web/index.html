<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SondeAlert Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    :root {
      --bg-dark: #121212;
      --panel-dark: #1e1e1e;
      --accent: #1e90ff;
      --text-light: #e0e0e0;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-light);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #0a0a0a;
      color: var(--text-light);
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    header a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    #map { flex: 1; width: 100%; }

    #info-panel {
      background: var(--panel-dark);
      border-top: 2px solid var(--accent);
      padding: 15px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      box-shadow: 0 -2px 6px rgba(0,0,0,0.7);
    }

    .info-box {
      flex: 1;
      min-width: 250px;
      margin: 6px;
      padding: 10px;
      background: #2a2a2a;
      border-radius: 10px;
      border: 1px solid #333;
    }

    .info-box h3 {
      margin-top: 0;
      font-size: 1rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    footer {
      text-align: center;
      background: #0a0a0a;
      color: #888;
      font-size: 0.85rem;
      padding: 10px;
    }

    .leaflet-control-layers {
      background: rgba(30,30,30,0.9);
      color: #fff;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .status-ok { color: #6be075; font-weight: bold; }
    .status-warn { color: #ffad33; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <div><strong>SondeAlert</strong></div>
    <div><a href="/settings.html">⚙️ Settings</a></div>
  </header>

  <div id="map"></div>

  <div id="info-panel">
    <div class="info-box">
      <h3>GPS Status</h3>
      <p id="gps-status">Status: unknown</p>
      <p id="gps-coords">Lat: ---, Lon: ---</p>
    </div>

    <div class="info-box">
      <h3>Nearest Sonde</h3>
      <p id="sonde-name">Name: ---</p>
      <p id="sonde-dist">Distance: ---</p>
      <p id="sonde-alt">Altitude: ---</p>
      <p id="sonde-status">Status: ---</p>
    </div>
  </div>

  <footer>© 2025 SondeAlert – Developed by Scops Owl Designs</footer>

  <script>
    // --- Base layers ---
    const osmMap = L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      { attribution: '&copy; OpenStreetMap contributors' }
    );
    const darkMap = L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      { attribution: '&copy; CartoDB DarkMatter' }
    );
    const satMap = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { attribution: 'Tiles © Esri' }
    );

    const map = L.map('map', { center: [52.1, 4.3], zoom: 9, layers: [osmMap] });
    const baseLayers = { "OpenStreetMap": osmMap, "Dark Mode": darkMap, "Satellite": satMap };
    L.control.layers(baseLayers, null, { position: 'topright' }).addTo(map);

    const myIcon = L.icon({
      iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
    });

    function createDot(color) {
      return L.divIcon({
        html: `<div style="width:14px;height:14px;background:${color};
                border-radius:50%;border:2px solid white;
                box-shadow:0 0 4px rgba(0,0,0,0.9);"></div>`,
        className: '',
        iconSize: [14, 14],
      });
    }

    const orangeDot = createDot('orange');
    const blueDot = createDot('#1e90ff');

    let gpsMarker = null;
    let sondeMarkers = [];
    let connectionLine = null;

    function formatDistance(m) {
      if (!m || isNaN(m)) return '?';
      return m < 1000 ? `${m.toFixed(0)} m` : `${(m / 1000).toFixed(2)} km`;
    }

    function updateInfoPanel(gps, nearest) {
      document.getElementById('gps-status').innerHTML = gps.fix
        ? `<span class="status-ok">✅ Fix OK</span>`
        : `<span class="status-warn">⚠️ No Signal</span>`;
      document.getElementById('gps-coords').textContent =
        `Lat: ${gps.lat ? gps.lat.toFixed(5) : '---'}, Lon: ${gps.lon ? gps.lon.toFixed(5) : '---'}`;
      if (nearest) {
        document.getElementById('sonde-name').textContent = `Name: ${nearest.place || 'Unknown'}`;
        document.getElementById('sonde-dist').textContent = `Distance: ${formatDistance(nearest.distance)}`;
        document.getElementById('sonde-alt').textContent = `Altitude: ${nearest.alt || '?'} m`;
        document.getElementById('sonde-status').textContent = `Status: ${nearest.status || 'Unknown'}`;
      }
    }

    async function updateData() {
      try {
        const gps = await fetch('/gps.json').then(r => r.json());
        const sondes = await fetch('/nearest.json').then(r => r.json());
        const lat = parseFloat(gps.lat) || 0, lon = parseFloat(gps.lon) || 0;

        if (!gpsMarker) gpsMarker = L.marker([lat, lon], { icon: myIcon }).addTo(map);
        else gpsMarker.setLatLng([lat, lon]);
        map.setView([lat, lon]);

        sondeMarkers.forEach(m => map.removeLayer(m));
        sondeMarkers = [];
        if (connectionLine) map.removeLayer(connectionLine);

        if (!Array.isArray(sondes) || sondes.length === 0) {
          updateInfoPanel(gps, null);
          return;
        }

        const nearest = sondes.reduce((a, b) => (a.distance < b.distance ? a : b));
        sondes.forEach(s => {
          const icon = (s.status === 'NEED ATTENTION') ? blueDot : orangeDot;
          const m = L.marker([s.lat, s.lon], { icon }).addTo(map);
          m.bindPopup(`<strong>${s.place || 'Unknown'}</strong><br>
            Distance: ${formatDistance(s.distance)}<br>
            Altitude: ${s.alt || '?'} m<br>Status: ${s.status || 'Unknown'}`);
          sondeMarkers.push(m);
        });

        if (nearest && nearest.lat && nearest.lon)
          connectionLine = L.polyline([[lat, lon], [nearest.lat, nearest.lon]], { color: '#ff4444', weight: 3 }).addTo(map);

        updateInfoPanel(gps, nearest);
      } catch (e) { console.error('Update error', e); }
    }

    updateData();
    setInterval(updateData, 5000);
  </script>
</body>
</html>
