<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SondeAlert Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background-color: #f7f9fb;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background-color: #005bbb;
      color: white;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    #map {
      flex: 1;
      width: 100%;
    }

    #info-panel {
      background: white;
      border-top: 3px solid #005bbb;
      padding: 15px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
    }

    .info-box {
      flex: 1;
      min-width: 250px;
      margin: 5px;
      padding: 10px;
      background: #f9fafc;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    .info-box h3 {
      margin-top: 0;
      font-size: 1rem;
      color: #005bbb;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-box p {
      margin: 3px 0;
      font-size: 0.9rem;
    }

    .status-ok {
      color: green;
      font-weight: bold;
    }

    .status-warn {
      color: #e67e22;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <div><strong>🛰️ SondeAlert</strong></div>
    <div><a href="/settings.html" style="color:white; text-decoration:none;">⚙️ Instellingen</a></div>
  </header>

  <div id="map"></div>

  <div id="info-panel">
    <div class="info-box">
      <h3>📡 GPS-status</h3>
      <p id="gps-status">Status: onbekend</p>
      <p id="gps-coords">Lat: ---, Lon: ---</p>
    </div>

    <div class="info-box">
      <h3>🛰️ Dichtstbijzijnde sonde</h3>
      <p id="sonde-name">Naam: ---</p>
      <p id="sonde-dist">Afstand: ---</p>
      <p id="sonde-alt">Hoogte: ---</p>
      <p id="sonde-status">Status: ---</p>
    </div>
  </div>

  <script>
    const map = L.map('map').setView([52.1, 4.3], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
    }).addTo(map);

    // === Iconen ===
    const myIcon = L.icon({
      iconUrl: '/static/my-marker.png',
      iconSize: [40, 40],
      iconAnchor: [20, 40],
      popupAnchor: [0, -35],
    });

    function createDot(color) {
      return L.divIcon({
        html: `<div style="width:16px;height:16px;background:${color};
               border-radius:50%;border:2px solid white;box-shadow:0 0 3px rgba(0,0,0,0.5);"></div>`,
        className: '',
        iconSize: [16, 16],
      });
    }

    const orangeDot = createDot('orange');
    const blueDot = createDot('#007bff');

    let gpsMarker = null;
    let sondeMarkers = [];
    let connectionLine = null;

    function formatDistance(m) {
      if (!m || isNaN(m)) return '?';
      if (m < 1000) return `${m.toFixed(0)} m`;
      return `${(m / 1000).toFixed(2)} km`;
    }

    function updateInfoPanel(gps, nearest) {
      document.getElementById('gps-status').innerHTML = gps.fix
        ? `<span class="status-ok">✅ Fix OK</span>`
        : `<span class="status-warn">⚠️ Geen signaal</span>`;
      document.getElementById('gps-coords').textContent =
        `Lat: ${gps.lat ? gps.lat.toFixed(5) : '---'}, Lon: ${gps.lon ? gps.lon.toFixed(5) : '---'}`;

      if (nearest) {
        document.getElementById('sonde-name').textContent = `Naam: ${nearest.place || 'Onbekend'}`;
        document.getElementById('sonde-dist').textContent = `Afstand: ${formatDistance(nearest.distance)}`;
        document.getElementById('sonde-alt').textContent = `Hoogte: ${nearest.alt || '?'} m`;
        document.getElementById('sonde-status').textContent = `Status: ${nearest.status || 'Onbekend'}`;
      } else {
        document.getElementById('sonde-name').textContent = 'Naam: ---';
        document.getElementById('sonde-dist').textContent = 'Afstand: ---';
        document.getElementById('sonde-alt').textContent = 'Hoogte: ---';
        document.getElementById('sonde-status').textContent = 'Status: ---';
      }
    }

    async function updateData() {
      try {
        const gps = await fetch('/gps.json').then(r => r.json());
        const sondes = await fetch('/nearest.json').then(r => r.json());

        const lat = parseFloat(gps.lat) || 0;
        const lon = parseFloat(gps.lon) || 0;

        // GPS marker
        if (!gpsMarker) {
          gpsMarker = L.marker([lat, lon], { icon: myIcon }).addTo(map);
          map.setView([lat, lon], 10);
        } else {
          gpsMarker.setLatLng([lat, lon]);
        }

        // Reset markers & lijn
        sondeMarkers.forEach(m => map.removeLayer(m));
        sondeMarkers = [];
        if (connectionLine) {
          map.removeLayer(connectionLine);
          connectionLine = null;
        }

        if (!Array.isArray(sondes) || sondes.length === 0) {
          console.warn('Geen sondes ontvangen.');
          updateInfoPanel(gps, null);
          return;
        }

        // Zoek dichtstbijzijnde
        let nearest = null;
        let minDist = Infinity;

        sondes.forEach(s => {
          if (!s.lat || !s.lon) return;
          const dist = parseFloat(s.distance) || Infinity;
          if (dist < minDist) {
            nearest = s;
            minDist = dist;
          }
        });

        // Voeg markers toe
        sondes.forEach(s => {
          if (!s.lat || !s.lon) return;
          const icon = (s.status === 'NEED ATTENTION') ? blueDot : orangeDot;
          const marker = L.marker([s.lat, s.lon], { icon }).addTo(map);
          marker.bindPopup(`
            <strong>${s.place || 'Onbekend'}</strong><br>
            Afstand: ${isNaN(s.distance) ? '?' : formatDistance(s.distance)}<br>
            Hoogte: ${s.alt || '?'} m<br>
            Status: ${s.status || 'Onbekend'}
          `);
          sondeMarkers.push(marker);
        });

        // Rode lijn tekenen
        if (nearest && nearest.lat && nearest.lon && lat && lon) {
          connectionLine = L.polyline(
            [[lat, lon], [nearest.lat, nearest.lon]],
            { color: 'red', weight: 3, dashArray: '6,6', opacity: 0.9 }
          ).addTo(map);
        }

        updateInfoPanel(gps, nearest);

      } catch (err) {
        console.error('Update-fout:', err);
      }
    }

    updateData();
    setInterval(updateData, 5000);
  </script>
</body>
</html>
