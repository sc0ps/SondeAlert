<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SondeAlert · Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header class="sa-header">
<div class="container">
<div class="brand">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2v20M2 12h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
<span>SondeAlert</span>
</div>
<nav class="nav">
<a class="btn btn-ghost" href="/settings">Instellingen</a>
</nav>
</div>
</header>


<main class="container grid">
<section class="card stretch">
<div class="card-header">
<h2>Live kaart</h2>
<div class="meta" id="gpsStatus">GPS: —</div>
</div>
<div id="map" class="map"></div>
<div class="legend">
<span class="dot dot-me"></span> Jij
<span class="dot dot-ok"></span> Sonde dichtbij
<span class="dot dot-far"></span> Sonde verder weg
</div>
</section>


<aside class="card">
<div class="card-header">
<h2>In de buurt</h2>
<button class="btn btn-ghost" id="forceRefresh" title="Nu verversen">↻</button>
</div>
<div id="list" class="list"></div>
</aside>
</main>


<footer class="container footnote">
<div>
<strong>Status:</strong> <span id="lastUpdate">—</span>
</div>
</footer>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="/static/app.js"></script>
</body>
</html>
