<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SondeAlert Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background-color: #f7f9fb;
    }

    header {
      background-color: #005bbb;
      color: white;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    #map {
      height: calc(100vh - 60px);
      width: 100%;
    }

    .sonde-popup {
      font-size: 0.9rem;
    }

    /* Info-paneel rechtsboven */
    #nearest-info {
      position: absolute;
      top: 75px;
      right: 15px;
      background: rgba(255,255,255,0.95);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      padding: 10px 15px;
      font-size: 0.9rem;
      min-width: 200px;
      line-height: 1.4;
    }

    #nearest-info strong {
      color: #005bbb;
    }

    #nearest-info small {
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>🛰️ SondeAlert</strong> &nbsp;
      <span id="gps-status">GPS: onbekend</span>
    </div>
    <div id="gps-coords">Lat: ---, Lon: ---</div>
    <div><a href="/settings.html" style="color:white; text-decoration:none;">⚙️ Instellingen</a></div>
  </header>

  <div id="map"></div>
  <div id="nearest-info">
    <strong>Dichtstbijzijnde sonde:</strong><br>
    <small>Geen gegevens...</small>
  </div>

  <script>
    const map = L.map('map').setView([52.1, 4.3], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap',
    }).addTo(map);

    // === Marker icons ===
    const myIcon = L.icon({
      iconUrl: '/static/my-marker.png', // jouw markerafbeelding
      iconSize: [40, 40],
      iconAnchor: [20, 40],
      popupAnchor: [0, -35]
    });

    const orangeIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-orange.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34]
    });

    const blueIcon = L.icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34]
    });

    let gpsMarker = null;
    let sondeMarkers = [];
    let connectionLine = null;

    function formatDistance(m) {
      if (m < 1000) return `${m.toFixed(0)} m`;
      return `${(m / 1000).toFixed(2)} km`;
    }

    function updateNearestInfo(sonde) {
      const box = document.getElementById('nearest-info');
      if (!sonde) {
        box.innerHTML = `<strong>Dichtstbijzijnde sonde:</strong><br><small>Geen gegevens...</small>`;
        return;
      }
      box.innerHTML = `
        <strong>${sonde.name || 'Onbekend'}</strong><br>
        Afstand: ${formatDistance(sonde.distance_m)}<br>
        Hoogte: ${sonde.alt_m || '?'} m<br>
        Status: ${sonde.status || 'Onbekend'}
      `;
    }

    async function updateData() {
      try {
        const gps = await fetch('/gps.json').then(r => r.json());
        const sondes = await fetch('/nearest.json').then(r => r.json());
        const lat = gps.lat || 0;
        const lon = gps.lon || 0;
        const fix = gps.fix ?? true;
        const gpsText = fix ? '✅ Fix OK' : '⚠️ Geen signaal';

        document.getElementById('gps-status').innerText = `GPS: ${gpsText}`;
        document.getElementById('gps-coords').innerText =
          `Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}`;

        // --- Jouw locatie ---
        if (!gpsMarker) {
          gpsMarker = L.marker([lat, lon], { icon: myIcon, title: 'Jouw positie' }).addTo(map);
        } else {
          gpsMarker.setLatLng([lat, lon]);
        }

        // --- Sondes ---
        sondeMarkers.forEach(m => map.removeLayer(m));
        sondeMarkers = [];
        let nearest = null, minDist = Infinity;

        sondes.forEach(s => {
          const icon = (s.status === 'NEED ATTENTION') ? blueIcon : orangeIcon;
          const marker = L.marker([s.lat, s.lon], { icon }).addTo(map);
          marker.bindPopup(`
            <div class="sonde-popup">
              <strong>${s.name || 'Onbekend'}</strong><br>
              Afstand: ${formatDistance(s.distance_m)}<br>
              Hoogte: ${s.alt_m || '?'} m<br>
              Status: ${s.status || 'Onbekend'}<br>
              Laatste update: ${s.time || '-'}
            </div>
          `);
          sondeMarkers.push(marker);
          if (s.distance_m < minDist) {
            nearest = s;
            minDist = s.distance_m;
          }
        });

        // --- Lijn tekenen ---
        if (connectionLine) map.removeLayer(connectionLine);
        if (nearest) {
          connectionLine = L.polyline([[lat, lon], [nearest.lat, nearest.lon]], {
            color: 'red',
            weight: 3,
            dashArray: '6,6'
          }).addTo(map);
        }

        updateNearestInfo(nearest);

      } catch (err) {
        console.error('Update-fout:', err);
      }
    }

    updateData();
    setInterval(updateData, 5000); // elke 5 seconden verversen
  </script>
</body>
</html>
