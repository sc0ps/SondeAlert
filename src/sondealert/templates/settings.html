<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>⚙️ SondeAlert Instellingen</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { max-width: 600px; margin: auto; }
    input[type=number] { width: 100px; }
    label { display: block; margin-top: 10px; }
    button { margin-top: 20px; padding: 8px 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>⚙️ SondeAlert Instellingen</h2>
    <form id="settingsForm">
      <label>Max afstand (m):
        <input type="number" name="NEAR_THRESHOLD_M" id="NEAR_THRESHOLD_M">
      </label>
      <label>Max hoogte (m):
        <input type="number" name="ALT_MAX_M" id="ALT_MAX_M">
      </label>
      <label>Update-interval (uur):
        <input type="number" name="UPDATE_HOURS" id="UPDATE_HOURS">
      </label>
      <label>
        <input type="checkbox" name="BUZZER_ENABLED" id="BUZZER_ENABLED"> Buzzer aanzetten
      </label>
      <button type="submit">Opslaan</button>
    </form>
    <p id="status"></p>
  </div>

  <script>
    async function loadSettings() {
      const res = await fetch("/api/settings");
      const data = await res.json();
      for (let key in data) {
        const el = document.getElementById(key);
        if (el) {
          if (el.type === "checkbox") el.checked = data[key];
          else el.value = data[key];
        }
      }
    }

    document.getElementById("settingsForm").addEventListener("submit", async e => {
      e.preventDefault();
      const form = new FormData(e.target);
      const body = new URLSearchParams(form).toString();
      await fetch("/api/settings", { method: "POST", body });
      document.getElementById("status").innerText = "Instellingen opgeslagen ✅";
    });

    loadSettings();
  </script>
</body>
</html>
